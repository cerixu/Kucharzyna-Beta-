name: Kucharzyna iPhone E2E

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: kucharzyna-e2e-main
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run iPhone E2E
        run: npx playwright test --project=iphone

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kucharzyna-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
